spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: atlasrh
  datasource:
    url: jdbc:postgresql://localhost:${DB_PORT:5433}/${POSTGRES_DB:atlasrh}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true
logging:
  level:
    liquibase: DEBUG
    org.springframework.boot.autoconfigure.liquibase: DEBUG
