
databaseChangeLog:
  - changeSet:
      id: 4
      author: younes
      changes:
        - createTable:
            tableName: contracts
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: contract_type
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

              - column:
                  name: start_date
                  type: DATE
                  constraints:
                    nullable: false

              - column:
                  name: end_date
                  type: DATE

              - column:
                  name: gross_salary
                  type: DECIMAL(12, 2)
                  constraints:
                    nullable: false

              - column:
                  name: is_active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false

              - column:
                  name: employee_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_contracts_employee
                    references: employees(id)

        - sql:
            sql: ALTER TABLE contracts
              ADD CONSTRAINT chk_contracts_gross_salary
              CHECK (gross_salary > 0)

        - sql:
            sql: ALTER TABLE contracts
              ADD CONSTRAINT chk_contracts_type
              CHECK (contract_type IN ('CDI', 'CDD', 'STAGE'))

        - sql:
            sql: ALTER TABLE contracts
              ADD CONSTRAINT chk_contracts_dates
              CHECK (end_date IS NULL OR end_date >= start_date)

        - sql:
            sql: >
              CREATE UNIQUE INDEX uq_contracts_employee_active
              ON contracts(employee_id)
              WHERE is_active = true;

        - createIndex:
            tableName: contracts
            indexName: idx_contracts_employee_id
            columns:
              - column:
                  name: employee_id