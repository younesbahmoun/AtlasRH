
databaseChangeLog:
  - changeSet:
      id: 6
      author: younes
      changes:
        - createTable:
            tableName: leave_requests
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: employee_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_leave_requests_employee
                    references: employees(id)

              - column:
                  name: leave_type_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_leave_requests_leave_type
                    references: leave_types(id)

              - column:
                  name: start_date
                  type: DATE
                  constraints:
                    nullable: false

              - column:
                  name: end_date
                  type: DATE
                  constraints:
                    nullable: false

              - column:
                  name: reason
                  type: TEXT
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: EN_ATTENTE
                  constraints:
                    nullable: false

              - column:
                  name: comment
                  type: TEXT

              - column:
                  name: decision_date
                  type: TIMESTAMP

        - sql:
            sql: >
              ALTER TABLE leave_requests
              ADD CONSTRAINT chk_leave_requests_dates
              CHECK (end_date >= start_date)

        - sql:
            sql: >
              ALTER TABLE leave_requests
              ADD CONSTRAINT chk_leave_requests_status
              CHECK (status IN
              ('EN_ATTENTE', 'APPROUVEE', 'REFUSEE', 'ANNULEE'))

        - createIndex:
            tableName: leave_requests
            indexName: idx_leave_requests_employee
            columns:
              - column:
                  name: employee_id

        - createIndex:
            tableName: leave_requests
            indexName: idx_leave_requests_status
            columns:
              - column:
                  name: status